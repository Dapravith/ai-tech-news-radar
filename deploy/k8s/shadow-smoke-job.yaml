# Disposable CI integration test ONLY. Uses the same nonroot news image,
# no network-dependent feeds, no credentials and no Telegram delivery.
apiVersion: batch/v1
kind: Job
metadata:
  name: phase2-shadow-smoke
  namespace: news-radar-shadow
  labels:
    app.kubernetes.io/name: news-radar
    news-radar/phase: shadow
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: news-radar
        news-radar/phase: shadow
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rss-smoke
          image: radar-shadow:ci
          imagePullPolicy: Never
          command: ["python", "-m", "scripts.smoke_container"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: TELEGRAM_BOT_TOKEN
              value: ""
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: reports
              mountPath: /app/out
      volumes:
        - name: reports
          emptyDir:
            sizeLimit: 8Mi
